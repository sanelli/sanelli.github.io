---
layout: default
---
<div class="home">
  {{ content }}

  {%- if site.posts.size > 0 -%}
  <h2 class="post-list-heading">{{ page.list_title | default: "Posts" }}</h2>
  {% include post-list.html posts=site.posts limit=5 %}
  <p class="post-list-more"><a href="{{ '/posts/' | relative_url }}">All posts</a></p>
  {%- endif -%}

  <p class="home-stats-link"><a href="{{ '/stats/' | relative_url }}">Stats for nerds</a></p>
</div>
