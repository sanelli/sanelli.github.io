---
layout: default
---
<article class="post">

  <header class="post-header{% if page.travels_map %} post-header--travels{% endif %}">
    <h1 class="post-title">{%- include_cached icon.html name=page.icon -%}{{ page.title | escape }}</h1>
    {%- if page.travels_map -%}
    {%- include_cached travels-countries-summary.html -%}
    {%- endif -%}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
