<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}" data-theme="dark">

  {%- include head.html -%}

  <body class="layout-{{ page.layout }}{% if page.body_class %} {{ page.body_class }}{% endif %}">
    {%- include icons.svg -%}

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    {%- if page.sortable_tables -%}
    <script src="{{ '/assets/js/tablesort.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/tablesort.number.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/media-tables.js' | relative_url }}"></script>
    {%- endif -%}

  </body>

</html>
