- slug: eml
  section: interpreters
  category: eml
  icon: eml
  name: EML
  why: Math expressions down to a two-opcode stack IR, then run or emit JS, C, and .NET.
  description: >
    An [Ada](https://ada-lang.io) compiler and interpreter for EML
    ([All elementary functions from a single operator](https://arxiv.org/html/2603.21852v2)),
    a tiny language built around `eml(x, y) = exp(x) − ln(y)` over complex
    numbers. Front ends cover math source (`.mxeml`), nested trees (`.teml`),
    textual stack IR (`.eml`), and packed binary (`.beml`). Pipelines
    preprocess, tokenize, parse, compile, and run; compile targets include
    `.eml` / `.beml` IR, browser JavaScript (math.js), C
    (`long double complex`, plus a library form with a companion header),
    C# / F# / Visual Basic / IL, and .NET DLLs or a host-native publish when
    the `dotnet` SDK is installed. Built with [Alire](https://alire.ada.dev).
  links:
    - text: GitHub
      url: https://github.com/sanelli/eml
  tags: [ada, Alire, compiler, interpreter, eml, math]

