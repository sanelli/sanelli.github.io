- slug: mappa
  section: flagship
  category: mappa
  icon: mappa
  name: Mappa
  why: Compile-time mapping that stays Native AOT friendly, readable, and reusable.
  description: >
    A C# source generator that emits plain mapping code between types — similar
    in spirit to [AutoMapper](https://www.nuget.org/packages/AutoMapper), but the
    work happens at compile time. Attributes configure the mapper without changing
    source or target types; missing nested maps are generated for you. Methods can
    live on any partial class, including static types and extension methods.
    Companion packages cover Google.Protobuf well-known types and MongoDB BSON.
    Recent releases add `IQueryable` projection, polymorphic mapping, reference
    and cycle handling, and dependency-injection registration.
  links:
    - text: GitHub
      url: https://github.com/sanelli/Mappa
    - text: NuGet
      url: https://www.nuget.org/packages/Mappa
  tags: [C#, source-generator, csharp, dotnet]

- slug: todo-analyzer
  section: libraries
  category: todo
  icon: todo
  name: Comment TODO Analyzer
  why: TODOs without a ticket number rot; this makes the format a compiler rule.
  description: >
    A Roslyn analyzer that requires every `TODO` comment to follow the same
    shape. Built-in formats are GitHub (`TODO [#33] This needs to be handled.`),
    Jira (`TODO [COMMON-1234] This needs to be handled!`), and plain
    (`TODO: Should we handle this?`), or a custom regex from `.editorconfig`.
    Optional rules fail the build on any leftover TODO (`TA0002`) or on a list
    of task IDs you want closed (`TA0003`).
  links:
    - text: GitHub
      url: https://github.com/sanelli/Todo.Analyzer
    - text: NuGet
      url: https://www.nuget.org/packages/Comment.Todo.Analyzer
  tags: [C#, analyzer, csharp, dotnet]

- slug: prettycode
  section: libraries
  category: prettycode
  icon: prettycode
  name: PrettyCode.StringBuilder
  why: Generated source is easier to debug when indent and directives nest and unwind themselves.
  description: >
    A `StringBuilder` wrapper for emitting formatted source. Disposable scopes
