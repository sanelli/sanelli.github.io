<div class="media-toolbar" role="search">
  <label class="media-toolbar-field">
    <span class="media-toolbar-label">Search</span>
    <input type="search" class="media-search" placeholder="Title, people, genre…" autocomplete="off">
  </label>
  <label class="media-toolbar-field">
    <span class="media-toolbar-label">Rating</span>
    <select class="media-rating-filter">
      <option value="">All</option>
      <option value="5">⭐️⭐️⭐️⭐️⭐️</option>
      <option value="4">⭐️⭐️⭐️⭐️ and up</option>
      <option value="3">⭐️⭐️⭐️ and up</option>
      <option value="2">⭐️⭐️ and up</option>
    </select>
  </label>
  <p class="media-toolbar-hint">Search and rating apply across every year.</p>
  <p class="media-filter-status" hidden></p>
</div>
