{%- assign lang = include.language | downcase | strip -%}
{%- if lang == "italian" -%}<svg class="media-flag" title="Italian" aria-label="Italian" focusable="false"><use href="#flag-it"></use></svg>{%- elsif lang == "english" -%}<svg class="media-flag" title="English" aria-label="English" focusable="false"><use href="#flag-gb"></use></svg>{%- elsif include.language -%}<code>{{ include.language }}</code>{%- endif -%}
